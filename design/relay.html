<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relay — herdr workbench</title>
<style>
/* =========================================================================
   Relay: colour only means state. Everything structural is achromatic.
   ========================================================================= */
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  --r: 3px;
}
html[data-theme="dark"]{
  --bg:#0d1012; --panel:#13171a; --raise:#1a2024; --raise2:#20272c;
  --rule:#283136; --rule-soft:#1e262a;
  --ink:#e8ebe6; --muted:#93a0a4; --dim:#5e6b71;
  --you:#e8ebe6; --agent:#5fb3a4; --person:#c08ad0;
  --review:#d9a34a; --blocked:#e0705f; --started:#7fa8d0; --ready:#9cbf6a; --done:#5e6b71;
  --term-bg:#0a0d0e; --term-ink:#c8d0cb; --term-dim:#6c7a76;
  --sel:#242c31;
}
html[data-theme="light"]{
  --bg:#eceae3; --panel:#f7f6f1; --raise:#ffffff; --raise2:#f1efe7;
  --rule:#d7d3c6; --rule-soft:#e4e0d5;
  --ink:#191c1b; --muted:#6a6f69; --dim:#9a9e95;
  --you:#191c1b; --agent:#1e7a6e; --person:#7a4b86;
  --review:#8f6414; --blocked:#a83a2c; --started:#2f5f8a; --ready:#55702a; --done:#9a9e95;
  --term-bg:#f2f0e8; --term-ink:#33393a; --term-dim:#8a8f86;
  --sel:#e6e3d9;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:13px/1.45 var(--font);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit;background:none;border:0;outline:0}
::selection{background:var(--sel)}
:focus-visible{outline:1px solid var(--ink);outline-offset:1px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---- app frame ---- */
.app{height:100%;display:grid;grid-template-rows:38px 1fr}
.titlebar{
  display:flex;align-items:center;gap:10px;padding:0 12px;
  border-bottom:1px solid var(--rule); background:var(--panel);
  -webkit-app-region:drag;
}
.lights{display:flex;gap:6px;margin-right:6px}
.lights i{width:10px;height:10px;border-radius:50%;background:var(--rule);display:block}
.brand{display:flex;align-items:center;gap:7px;font-weight:600;letter-spacing:-.01em}
.brand svg{display:block}
.tb-spacer{flex:1}
.tb-btn{
  height:24px;padding:0 8px;display:flex;align-items:center;gap:6px;
  border:1px solid transparent;border-radius:var(--r);color:var(--muted);
}
.tb-btn:hover{background:var(--raise);color:var(--ink)}
.tb-btn kbd{
  font:10px var(--mono);border:1px solid var(--rule);border-radius:2px;
  padding:0 3px;color:var(--dim);
}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:0}
.side{
  background:var(--panel);border-right:1px solid var(--rule);
  display:flex;flex-direction:column;min-height:0;
}
.side-scroll{overflow:auto;flex:1;padding:10px 0 4px}

/* ---- sidebar ---- */
.side h2{
  display:flex;align-items:center;gap:6px;
  font-size:11px;font-weight:500;color:var(--muted);
  margin:0;padding:8px 12px 5px;
}
.side h2 .n{color:var(--dim)}
.side h2 .add{margin-left:auto;color:var(--dim);width:16px;height:16px;display:grid;place-items:center;border-radius:2px}
.side h2 .add:hover{background:var(--raise);color:var(--ink)}
.row{
  width:100%;display:flex;align-items:center;gap:8px;
  padding:5px 12px;text-align:left;border-left:2px solid transparent;
  color:var(--muted);
}
.row:hover{background:var(--raise);color:var(--ink)}
.row.on{background:var(--raise);color:var(--ink);border-left-color:var(--ink)}
.row.linked{background:var(--raise);color:var(--ink);border-left-color:var(--agent)}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font:10.5px var(--mono);color:var(--dim);display:flex;align-items:center;gap:5px}
.row .meta b{font-weight:500;color:var(--muted)}
.need{display:inline-flex;align-items:center;justify-content:center;min-width:15px;height:15px;padding:0 4px;
  font:10px var(--mono);color:var(--review);border:1px solid color-mix(in oklab,var(--review) 55%,transparent);border-radius:2px}
.glyph{width:100%;display:flex;align-items:center;gap:8px}
.glyph i{font-size:9px;line-height:1;width:9px;text-align:center;font-style:normal}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--agent);flex:none}
.live-dot.working{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 color-mix(in oklab,var(--agent) 55%,transparent)}50%{opacity:.55;box-shadow:0 0 0 3px transparent}}
.side-foot{border-top:1px solid var(--rule);padding:7px 12px;color:var(--dim);display:flex;gap:10px;align-items:center}

/* ---- work column ---- */
.work{display:grid;grid-template-rows:40px 64px 1fr 26px;min-width:0;min-height:0}
.tabbar{display:flex;align-items:stretch;gap:1px;padding:5px 6px 0;border-bottom:1px solid var(--rule);background:var(--panel)}
.tab{
  display:flex;align-items:center;gap:7px;min-width:0;max-width:230px;
  padding:0 9px;border:1px solid transparent;border-bottom:0;border-radius:3px 3px 0 0;
  color:var(--muted);font-size:12px;
}
.tab:hover{color:var(--ink);background:var(--raise)}
.tab.on{background:var(--bg);border-color:var(--rule);color:var(--ink);margin-bottom:-1px;padding-bottom:1px}
.tab.linked{background:color-mix(in oklab,var(--tl,var(--agent)) 11%,var(--bg));border-color:color-mix(in oklab,var(--tl,var(--agent)) 40%,var(--rule))}
.tab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .tn{font:10px var(--mono);color:var(--dim);border:1px solid var(--rule);border-radius:2px;padding:0 3px}
.tab.on .tn{color:var(--muted)}
.tab.linked .tn{border-color:color-mix(in oklab,var(--tl,var(--agent)) 55%,var(--rule));color:var(--tl,var(--agent))}
.tab.flash{box-shadow:inset 0 -2px 0 var(--ink)}
.rt{position:relative;display:flex;align-items:center;align-self:stretch;gap:6px;min-width:0;max-width:250px;
  padding:0 10px;border:1px solid transparent;border-bottom:0;border-radius:3px 3px 0 0;
  color:var(--muted);font-size:12px}
.rt:hover{color:var(--ink);background:var(--raise)}
.rt.on{background:var(--bg);border-color:var(--rule);color:var(--ink);margin-bottom:-1px}
.rt.linked{background:color-mix(in oklab,var(--tl,var(--agent)) 12%,var(--bg))}
.rt .rl{position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:1px;
  background:var(--tl,var(--rule));opacity:.55}
.rt.on .rl{left:0;right:0;opacity:1}
.rt:hover .rl{opacity:.85}
.rt .notch{position:absolute;top:3px;right:3px;width:4px;height:4px;border-radius:50%;background:var(--review)}
.rt .tn{font:10px var(--mono);color:var(--dim);border:1px solid var(--rule);border-radius:2px;padding:0 3px}
.rt.linked .tn,.rt.on .tn{color:var(--muted)}
.rt.add{color:var(--dim);width:30px;justify-content:center;padding:0}
.proto{border:1px dashed var(--rule)!important;opacity:.8}
.proto b{font-weight:600;color:var(--ink)}
.tabbar .fill{flex:1}
.tabbar .tools{display:flex;align-items:center;gap:2px;padding-bottom:5px}
.tb{height:24px;display:flex;align-items:center;gap:5px;padding:0 8px;border-radius:2px;color:var(--dim);font-size:11.5px}
.tb:hover{background:var(--raise);color:var(--ink)}
.tb .need{margin-left:2px}

/* ---- ribbon: one task's baton trace ---- */
.ribbon{
  position:relative;overflow:hidden;background:var(--panel);
  border-bottom:1px solid var(--rule);
  display:grid;grid-template-columns:82px 1fr auto;align-items:stretch;
}
.rb-label{
  display:flex;flex-direction:column;justify-content:center;gap:2px;
  padding-left:12px;border-right:1px solid var(--rule-soft);min-width:0;
}
.rb-label b{font:10.5px var(--mono);font-weight:500;color:var(--muted);letter-spacing:.01em}
.rb-label span{font-size:10px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb-now b{color:var(--ink);font-weight:500}
.rb-plot{position:relative;min-width:0}
.rb-now{
  display:flex;align-items:center;gap:6px;padding:0 10px 0 4px;
  font:10px var(--mono);color:var(--dim);border-left:1px solid var(--rule-soft);
}
.rb-now .hold{color:var(--ink)}
svg.trace{position:absolute;inset:0;display:block;overflow:visible}
.lane-name{font:9.5px var(--mono);fill:var(--dim)}
.ev-text{font:8.5px var(--mono);fill:var(--dim)}
.dur{font:8.5px var(--mono);fill:var(--panel);opacity:.75}
.dur.on-hollow{fill:var(--muted);opacity:1}
.tick-line{stroke:var(--rule-soft);stroke-width:1}
.tick-text{font:9px var(--mono);fill:var(--dim)}
.trace-line{fill:none;stroke-width:1.4;stroke-linejoin:round}
.trace-ghost{opacity:.4}.btn.pri.off{background:transparent;border-color:var(--rule);color:var(--dim);font-weight:400;cursor:default}
.ask{display:flex;align-items:center;gap:6px;margin-top:8px;padding:7px 8px;border:1px solid var(--rule);border-left:2px solid var(--review);background:var(--bg);border-radius:2px}
.ask span{flex:1;min-width:0;font-size:11px;color:var(--muted)}
.trace-live{stroke-dasharray:3 3;animation:march 1.4s linear infinite}
@keyframes march{to{stroke-dashoffset:-6}}
.bead{cursor:pointer}
.bead:hover circle.halo{opacity:1}
.bead circle.halo{opacity:0;transition:opacity .15s}
.now-mark{fill:var(--ink)}

/* ---- stage ---- */
.stage{display:grid;grid-template-columns:1fr 380px;min-height:0;gap:8px;padding:8px}
.term{
  min-width:0;min-height:0;display:flex;flex-direction:column;
  border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--term-bg);
}
.pane-head{
  height:30px;display:flex;align-items:center;gap:8px;padding:0 10px;
  border-bottom:1px solid var(--rule);color:var(--muted);font-size:11.5px;background:var(--bg);
}
.pane-head .dot{width:6px;height:6px;border-radius:50%;background:var(--agent)}
.pane-head .path{color:var(--dim);font-family:var(--mono);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pane-head .grow{flex:1}
.pane-head .tag{font:10px var(--mono);color:var(--review);border:1px solid color-mix(in oklab,var(--review) 45%,transparent);border-radius:2px;padding:0 4px}
.pane-head .tag:hover{background:color-mix(in oklab,var(--review) 14%,transparent)}
.term-body{padding:12px 14px;overflow:auto;font:11.5px/1.62 var(--mono);color:var(--term-ink)}
.term-body .cmd{color:var(--ink)}
.term-body .p{color:var(--dim)}
.term-body .ok{color:var(--ready)}
.term-body .warn{color:var(--review)}
.term-body .add{color:var(--ready)}
.term-body .del{color:var(--blocked)}
.term-body .cmt{color:var(--term-dim)}
.term-body p{margin:0 0 9px}
.term-body .gap{height:14px}
.term-body .transcript{border-left:1px solid var(--rule);padding-left:12px;margin:10px 0 0}
.term-body .who{font-family:var(--font);font-size:10.5px;color:var(--dim);margin-bottom:4px}
.term-body .diff{margin:0 0 9px}
.term-body .diff pre{margin:0;font:10.5px/1.6 var(--mono);color:var(--term-ink);white-space:pre;overflow:hidden}
.term-body .diff .dl{color:var(--blocked);opacity:.9}
.term-body .diff .dh{color:var(--dim)}

/* ---- relay panel ---- */
.relay{
  min-width:0;min-height:0;display:grid;grid-template-rows:auto auto auto 1fr auto;
  border:1px solid var(--rule);border-radius:6px;background:var(--panel);overflow:hidden;
}
.rp-head{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.mark{width:17px;height:17px;flex:none}
.rp-head h1{font-size:14px;font-weight:600;margin:0;letter-spacing:-.01em}
.rp-head .sub{color:var(--dim);font-size:11px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:22px;height:22px;display:grid;place-items:center;border-radius:2px;color:var(--dim)}
.icon-btn:hover{background:var(--raise);color:var(--ink)}
.icon-btn.on{color:var(--ink)}
.rp-filters{display:flex;align-items:center;gap:2px;padding:0 12px;border-bottom:1px solid var(--rule-soft)}
.seg{padding:6px 7px 7px;color:var(--muted);font-size:11.5px;border-bottom:1px solid transparent;margin-bottom:-1px;display:flex;gap:5px;align-items:center}
.seg b{font:10.5px var(--mono);font-weight:500;color:var(--dim)}
.seg:hover{color:var(--ink)}
.seg.on{color:var(--ink);border-bottom-color:var(--ink)}
.seg.on b{color:var(--ink)}
.rp-filters .fill{flex:1}
.rp-filters .group{display:flex;gap:1px;padding-bottom:2px}
.gbtn{font-size:10.5px;color:var(--dim);padding:3px 5px;border-radius:2px}
.gbtn:hover{color:var(--ink);background:var(--raise)}
.gbtn.on{color:var(--ink);background:var(--sel)}
.rp-list{overflow:auto;min-height:0;padding:2px 0 10px}
.rp-search{display:flex;align-items:center;gap:6px;margin:8px 12px 6px;height:26px;padding:0 8px;
  border:1px solid var(--rule);border-radius:2px;background:var(--bg);color:var(--dim)}
.rp-search input{flex:1;min-width:0;font-size:11.5px;color:var(--ink)}
.rp-search input::placeholder{color:var(--dim)}
.grp{display:flex;align-items:baseline;gap:6px;padding:10px 12px 3px;font-size:11px;color:var(--muted)}
.grp .cnt{font:10px var(--mono);color:var(--dim)}
.grp .att{margin-left:auto;font:10px var(--mono);color:var(--review)}
.grp .load{display:flex;gap:2px;margin-left:6px}
.grp .load i{width:8px;height:3px;background:var(--rule);display:block}
.grp .load i.f{background:var(--muted)}

.task{width:100%;display:flex;align-items:center;gap:8px;padding:0 12px 0 12px;height:29px;
  text-align:left;border-left:2px solid transparent;position:relative}
.task:hover{background:var(--raise)}
.task.on{background:var(--raise);border-left-color:var(--ink)}
.task .num{font:10px var(--mono);color:var(--dim);width:24px;flex:none}
.task.on .num{color:var(--muted)}
.task .ti{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.task.done .ti{color:var(--dim);text-decoration:line-through;text-decoration-thickness:1px}
.task .tabchip{font:9.5px var(--mono);color:var(--dim);border:1px solid var(--rule);border-radius:2px;padding:0 3px}
.task.on .tabchip,.task:hover .tabchip{color:var(--muted)}
.task .who{font-size:9px;color:var(--muted);width:9px;text-align:center;flex:none}
.rail{display:flex;align-items:center;gap:2px;width:30px;flex:none}
.rail i{display:block;width:3px;height:5px;background:var(--rule-soft);border-radius:1px}
.rail i.f{height:8px;background:color-mix(in oklab,var(--dim) 42%,transparent)}
.rail i.cur{height:11px}

/* expanded detail */
.map{display:flex;flex-direction:column;padding:2px 8px 6px}
.map-h,.map-r{display:grid;grid-template-columns:28px 1fr 30px;align-items:center;gap:6px}
.map-h{height:16px;font:8.5px var(--mono);color:var(--dim)}
.map-r{height:27px;border-radius:2px;cursor:pointer;padding:0 2px;margin:0 -2px}
.map-r:hover{background:var(--hover)}
.map-r.on{background:var(--selected)}
.map-r .no{font:10px var(--mono);color:var(--dim);text-align:right}
.map-r.on .no{color:var(--ink)}
.map-r .age{font:9px var(--mono);color:var(--dim);text-align:right}
.map-p{position:relative;height:100%}
.map-g{position:absolute;top:0;bottom:0;width:1px;background:var(--rule-soft)}
.map-g.now{background:color-mix(in oklab,var(--ink) 45%,transparent);width:1px}
.map-b{position:absolute;top:50%;height:9px;transform:translateY(-50%);border-radius:1.5px;min-width:2px}
.map-b.human{background:repeating-linear-gradient(45deg,var(--ink) 0 1px,transparent 1px 4px);
  border:1px solid color-mix(in oklab,var(--ink) 45%,transparent)}
.map-b.none{background:none;border-top:1px dashed var(--dim);height:0;min-width:2px}
.map-b.live{animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.72}50%{opacity:.42}}
.map-foot{display:flex;align-items:center;gap:10px;padding:6px 2px 0;font:8.5px var(--mono);color:var(--dim)}
.load-blk{margin:16px 2px 0;padding-top:9px;border-top:1px solid var(--rule-soft)}
.load-h{font:8.5px var(--mono);color:var(--dim);letter-spacing:.04em;text-transform:uppercase;margin-bottom:5px}
.load-r{display:grid;grid-template-columns:12px 58px 1fr 16px;gap:7px;align-items:center;height:21px;
  border-radius:2px;padding:0 2px;margin:0 -2px;cursor:pointer}
.load-r:hover{background:var(--hover)}
.load-r .nm{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.load-r .tr{height:6px;border-radius:1px;background:var(--rule-soft);position:relative;overflow:hidden}
.load-r .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:1px}
.load-r .ct{font:9.5px var(--mono);color:var(--dim);text-align:right}
.load-r.zero .nm,.load-r.zero .ct{color:var(--dim)}
.map-foot i{display:inline-block;width:14px;height:7px;border-radius:1px;vertical-align:-1px;margin-right:3px}
.det{padding:2px 12px 10px 46px;position:relative}
.det:before{content:"";position:absolute;left:38px;top:0;bottom:12px;width:1px;background:var(--rule)}
.chain{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin:4px 0 9px}
.chip{display:inline-flex;align-items:center;gap:5px;height:19px;padding:0 6px;border:1px solid var(--rule);
  border-radius:2px;font:10.5px var(--mono);color:var(--muted);background:var(--bg)}
.chip:hover{border-color:var(--muted);color:var(--ink)}
.chip b{font-weight:500;color:var(--ink);font-family:var(--font);font-size:11px}
.chip.gone{color:var(--dim);border-style:dashed}
.chip.gone:hover{color:var(--muted)}
.wire{width:11px;height:1px;background:var(--rule);flex:none}
.sect{font-size:10.5px;color:var(--dim);margin:8px 0 4px}
.check,.step{display:flex;align-items:flex-start;gap:7px;width:100%;text-align:left;padding:3px 0;color:var(--muted);font-size:11.5px;line-height:1.35}
.check:hover,.step:hover{color:var(--ink)}
.box{width:10px;height:10px;flex:none;margin-top:3px;border:1px solid var(--input,var(--muted));border-radius:1px;display:grid;place-items:center}
.check.on .box{background:var(--ink);border-color:var(--ink)}
.check.on .box svg{opacity:1}
.box svg{opacity:0}
.check.on{color:var(--dim)}
.check.on span{text-decoration:line-through;text-decoration-thickness:1px}
.step .box{border-radius:50%}
.step.on .box{background:var(--muted);border-color:var(--muted)}
.step.on .box svg{opacity:1}
.why{background:var(--bg);border:1px solid var(--rule);border-left:2px solid var(--blocked);border-radius:2px;padding:7px 8px;margin:6px 0 8px}
.why p{margin:0 0 4px;font-size:11.5px;color:var(--ink);line-height:1.45}
.why .needs{font-size:10.5px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:3px;margin:6px 0 2px}
.opt{height:24px;display:flex;align-items:center;gap:7px;padding:0 8px;border:1px solid var(--rule);border-radius:2px;
  background:var(--bg);font-size:11.5px;color:var(--muted);text-align:left}
.opt:hover{border-color:var(--muted);color:var(--ink);background:var(--raise)}
.opt .k{font:9.5px var(--mono);color:var(--dim)}
.acts{display:flex;gap:5px;margin-top:9px;align-items:center}
.btn{height:24px;padding:0 9px;display:inline-flex;align-items:center;gap:5px;border-radius:2px;border:1px solid var(--rule);
  font-size:11.5px;color:var(--ink);background:var(--bg)}
.btn:hover{background:var(--raise);border-color:var(--muted)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--panel);font-weight:500}
.btn.pri:hover{opacity:.88;background:var(--ink)}
.btn.quiet{border-color:transparent;color:var(--dim)}
.btn.quiet:hover{color:var(--ink)}
.acts .sp{flex:1}
.log{margin-top:9px;border-top:1px solid var(--rule-soft);padding-top:6px}
.log p{display:flex;gap:7px;margin:0 0 2px;font:10px var(--mono);color:var(--dim);min-width:0}
.log p b{font-weight:400;color:var(--muted);flex:none}
.log p span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp-foot{border-top:1px solid var(--rule);padding:7px 10px 9px;background:var(--panel)}
.tgt{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--dim);margin-bottom:5px}
.capture{display:flex;align-items:center;gap:7px;height:28px;padding:0 8px;border:1px solid var(--rule);border-radius:2px;background:var(--bg);color:var(--dim)}
.capture input{flex:1;min-width:0;font-size:11.5px;color:var(--ink)}
.capture input::placeholder{color:var(--dim)}

/* ---- status bar ---- */
.status{display:flex;align-items:center;gap:12px;padding:0 12px;border-top:1px solid var(--rule);
  background:var(--panel);color:var(--dim);font-size:11px}
.status .sp{flex:1}
.status .k{display:flex;gap:5px;align-items:center}
.status kbd{font:9.5px var(--mono);border:1px solid var(--rule);border-radius:2px;padding:0 3px;color:var(--muted)}
.status .att{color:var(--review)}

/* ---- toast ---- */
.toast{
  position:fixed;right:404px;bottom:44px;max-width:340px;
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:var(--raise);border:1px solid var(--rule);border-left:2px solid var(--agent);
  border-radius:2px;font-size:11.5px;color:var(--ink);
  transform:translateY(6px);opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;
}
.toast.show{opacity:1;transform:none}
.toast .mono{color:var(--muted);font-size:10px}

/* ---- motion preferences ---- */
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
</style>

<script>
/* =========================================================================
   Fixtures: shaped like `tsk list --all --json` + herdr's spaces/tabs/terminals
   ========================================================================= */
const NOW = 17 * 60 + 24;           // minutes since midnight, the demo's "now"
const DAY0 = 9 * 60;

let spaces = [
  { id:"aurora", name:"aurora-api", branch:"feat/ingest", machine:null },
  { id:"lumen",  name:"lumen-web",  branch:"main",        machine:null },
  { id:"book",   name:"handbook",   branch:"docs/feb",    machine:null },
];

let actors = [
  { id:"you",   name:"You",   kind:"human",  state:"",        load:3 },
  { id:"pi",    name:"pi",    kind:"agent",  state:"working", load:2 },
  { id:"codex", name:"codex", kind:"agent",  state:"idle",    load:1 },
  { id:"dana",  name:"Dana",  kind:"person", state:"away",    load:1 },
];

/* status → stage index on the ruler (open 0 · ready 1 · started 2 · review 3 · done 4) */
const STAGE = { open:0, ready:1, started:2, blocked:2, review:3, done:4 };

let tasks = [
  /* holder = whose court the baton is in right now (review ⇒ the reviewer) */
  { n:31, title:"Decide: drop the legacy ingest path", space:"aurora", holder:"you", status:"review",
    thread:"ingest", tab:"t3", checks:[["Replay a batch twice",1],["Errors never drop a row",1],["Schema stays unchanged",0]],
    steps:[["Extract accept()",1],["Route both callers",1],["Delete the v1 handler",1],["Update the ingest README",0]],
    moves:[{m:860,a:"you",w:"started"},{m:861,a:"pi",w:"picked it up"},{m:966,a:"pi",w:"submitted for review"}],
    activity:[["16:06","pi","opened a review · 2/3 checks"],["15:58","pi","ticked Delete the v1 handler"],["14:20","you","moved it to started"]],
    needs:"you" },
  { n:29, title:"Rotate the staging data key", space:"aurora", holder:"you", status:"blocked",
    thread:"infra", tab:null, progress:2,
    block:{ why:"The staging key is also read by lumen-web's preview builds.", needs:"Pick who rotates first.",
            options:["Rotate staging now","Wait for the preview deploy","Give lumen-web its own key"] },
    moves:[{m:912,a:"you",w:"started"},{m:972,a:"you",w:"blocked it"}],
    activity:[["16:12","you","blocked it · waiting on a decision"],["15:12","you","moved it to started"]],
    needs:"you" },
  { n:27, title:"Ship rate limiting on the public ingest route", space:"aurora", holder:"pi", status:"started",
    thread:"ingest", tab:"t1", progress:2, live:true,
    steps:[["Measure today's burst",1],["Choose a bucket size",1],["Wire the middleware",0],["Load test at 2x",0]],
    moves:[{m:980,a:"you",w:"started"},{m:981,a:"pi",w:"picked it up"}],
    activity:[["16:44","pi","wired the first middleware pass"],["16:20","you","moved it to started"]],
    needs:null },
  { n:36, title:"Port ingest to the new queue", space:"aurora", holder:"codex", status:"ready",
    thread:"ingest", tab:null, after:[31], moves:[],
    activity:[["15:02","you","set it after T31"]], needs:null },
  { n:35, title:"Backfill the 2023 events table", space:"aurora", holder:"codex", status:"ready",
    thread:"data", tab:null, moves:[], activity:[["11:30","you","moved it to ready"]], needs:null },
  { n:38, title:"Write the replay test the review asks for", space:"aurora", holder:null, status:"open",
    thread:"ingest", tab:null, after:[31], moves:[], activity:[], needs:null },
  { n:33, title:"Delete the v1 webhook endpoint", space:"aurora", holder:"dana", status:"open",
    thread:"ingest", tab:null, moves:[],
    activity:[["10:14","you","assigned it to Dana"]], needs:"dana" },
  { n:6,  title:"Fix the empty state on the chart page", space:"lumen", holder:"you", status:"review",
    thread:"chart", tab:"t6", checks:[["Copy reads right at 320px",1],["No layout shift",1]],
    moves:[{m:930,a:"codex",w:"started"},{m:935,a:"codex",w:"submitted for review"}],
    activity:[["15:35","codex","opened a review · 2/2 checks"]], needs:"you" },
  { n:7,  title:"Replace the chart library", space:"lumen", holder:"codex", status:"started",
    thread:"chart", tab:"t7", progress:2, live:true,
    moves:[{m:970,a:"codex",w:"picked it up"}],
    activity:[["16:10","codex","started the migration"]], needs:null },
  { n:9,  title:"Dark theme audit", space:"lumen", holder:null, status:"open",
    thread:"chart", tab:null, moves:[], activity:[], needs:null },
  { n:8,  title:"Write the February changelog", space:"book", holder:"you", status:"review",
    thread:"release", tab:"t8", checks:[["Links resolve",1],["Version matches the tag",0]],
    moves:[{m:960,a:"you",w:"wrote it"},{m:975,a:"you",w:"opened a review"}],
    activity:[["16:15","you","opened a review · 1/2 checks"]], needs:"you" },
];

let tabs = {
  aurora: [
    { id:"t1", name:"ingest",   agent:"pi",    task:27, live:true,  settled:false },
    { id:"t3", name:"T31 tree", agent:"pi",    task:31, live:false, settled:false },
    { id:"t2", name:"shell",    agent:null,    task:null, live:false, settled:true },
  ],
  lumen: [
    { id:"t6", name:"chart",    agent:"codex", task:6,  live:false, settled:false },
    { id:"t7", name:"migrate",  agent:"codex", task:7,  live:true,  settled:false },
  ],
  book: [
    { id:"t8", name:"changelog", agent:null, task:8, live:false, settled:false },
  ],
};

const STRIPS = ["relay", "herdr"];
const S = {
  theme:"dark", space:"aurora", sel:31, actor:null, group:"holder",
  filter:"all", q:"", open:{}, toast:null, tabFlash:null, hover:null, ask:null, strip:"relay",
};

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const actorOf = (id) => actors.find((a) => a.id === id) || null;
const taskOf  = (n)  => tasks.find((t) => t.n === n) || null;
const spaceOf = (id) => spaces.find((s) => s.id === id) || null;
const glyph = (a) => a ? (a.kind === "agent" ? "◆" : a.kind === "person" ? "○" : "●") : "·";
const actorInk = (a) => !a ? "var(--dim)" : a.kind === "agent" ? "var(--agent)" : a.kind === "person" ? "var(--person)" : "var(--you)";
const statusInk = (s) => `var(--${s === "blocked" ? "blocked" : s === "review" ? "review" : s === "started" ? "started" : s === "ready" ? "ready" : s === "done" ? "done" : "muted"})`;
const liveTasks = () => tasks.filter((t) => t.status !== "done");
const needsYou = (t) => t.holder === "you" && (t.status === "review" || t.status === "blocked");
const inSpace = (t) => t.space === S.space;
const isOpen = (t) => Boolean(S.open[t.n]);
const tabOf = (t) => (t.tab ? (tabs[t.space] || []).find((x) => x.id === t.tab) || null : null);

function toast(text, tag="") {
  const el = $("#toast");
  el.innerHTML = `${tag ? `<span class="mono">${esc(tag)}</span>` : ""}<span>${esc(text)}</span>`;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 3200);
}

/* =========================================================================
   Sidebar
   ========================================================================= */
function renderSide() {
  $("#space-count").textContent = spaces.length;
  $("#spaces").innerHTML = spaces.map((s) => {
    const rows = liveTasks().filter((t) => t.space === s.id);
    const need = rows.filter(needsYou).length;
    const moving = rows.filter((t) => t.status === "started").length;
    const on = S.space === s.id;
    return `<button class="row ${on ? "on" : ""}" data-act="space" data-id="${s.id}">
      <span class="nm">${esc(s.name)}</span>
      <span class="meta">${moving ? `<span class="live-dot working" title="${moving} moving"></span>` : ""}${need ? `<span class="need" title="${need} wait on you">${need}</span>` : ""}<b class="mono" style="color:var(--dim);font-weight:400" title="${rows.length} live">${rows.length}</b></span>
    </button>`;
  }).join("");

  $("#actor-count").textContent = actors.length;
  $("#actors").innerHTML = actors.map((a) => {
    const held = liveTasks().filter((t) => t.holder === a.id)
      .sort((x, y) => STAGE[y.status] - STAGE[x.status]);
    const need = held.filter(needsYou).length;
    const on = S.actor === a.id;
    const holding = !on && S.sel && taskOf(S.sel) && taskOf(S.sel).holder === a.id;
    return `<button class="row ${on ? "on" : holding ? "linked" : ""}" data-act="actor" data-id="${a.id}" title="${esc(a.name)} holds ${held.length}">
      <span style="color:${actorInk(a)};font-size:9px;width:9px;text-align:center">${glyph(a)}</span>
      <span class="nm">${esc(a.name)}</span>
      <span class="meta">
        ${a.state === "working" ? `<span class="live-dot working" title="working"></span>` : a.state === "away" ? `<span class="live-dot" style="background:var(--dim)"></span>` : ""}
        ${held.length ? `<b class="mono" style="color:var(--dim);font-weight:400">T${((S.sel && held.find((t) => t.n === S.sel)) || held[0]).n}</b>` : `<b style="color:var(--dim)">idle</b>`}
        ${need ? `<span class="need">${need}</span>` : ""}
      </span>
    </button>`;
  }).join("");

  const running = actors.filter((a) => a.state === "working").length;
  $("#foot-agents").textContent = `${running} running`;
  $("#st-left").textContent = `${actors.filter((a) => a.kind === "agent").length} agents · ${running} running`;
  const att = liveTasks().filter(needsYou).length;
  $("#st-att").textContent = att ? `${att} wait on you` : "nothing waits on you";
}

/* =========================================================================
   Tab bar — tabs carry the task they serve; the selected task lights its tab
   ========================================================================= */
function renderTabs() {
  const list = tabs[S.space] || [];
  const sel = S.sel ? taskOf(S.sel) : null;
  const linkedTab = sel && sel.space === S.space ? sel.tab : null;
  const active = linkedTab || (list.find((t) => !t.settled) || list[0] || {}).id;
  const html = list.map((t) => {
    const task = t.task ? taskOf(t.task) : null;
    const li = t.live ? `<span class="live-dot working" title="working"></span>` : t.agent ? `<span style="color:${actorInk(actorOf(t.agent))};font-size:9px">◆</span>` : "";
    return `<button class="tab ${t.id === active ? "on" : ""} ${t.id === linkedTab ? "linked" : ""} ${S.tabFlash === t.id ? "flash" : ""}"
      data-act="tab" data-id="${t.id}" style="${t.id === linkedTab ? `--tl:${statusInk(sel.status)}` : ""}${t.settled ? "opacity:.55" : ""}">
      ${li}<span class="nm">${esc(t.name)}</span>
      ${task ? `<span class="tn">T${task.n}</span>` : ""}
    </button>`;
  }).join("");

  if (S.strip === "relay") {
    const own = list.map((t) => {
      const task = t.task ? taskOf(t.task) : null;
      const ink = task ? statusInk(task.status) : null;
      const li = t.live ? `<span class="live-dot working" title="working"></span>`
        : t.agent ? `<span style="color:${actorInk(actorOf(t.agent))};font-size:9px">◆</span>`
        : task ? `<span style="color:${actorInk(actorOf(task.holder))};font-size:9px">${glyph(actorOf(task.holder))}</span>` : "";
      return `<button class="rt ${t.id === active ? "on" : ""} ${t.id === linkedTab ? "linked" : ""}"
        data-act="tab" data-id="${t.id}"
        style="${ink ? `--tl:${ink}` : ""}${t.settled ? "opacity:.55" : ""}">
        ${li}<span class="nm" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.name)}</span>
        ${task ? `<span class="tn">T${task.n}</span>` : ""}
        ${task && needsYou(task) ? `<span class="notch" title="waits on you"></span>` : ""}
        ${task ? `<span class="rl"></span>` : ""}
      </button>`;
    }).join("");
    $("#tabbar").innerHTML = `${own}<button class="rt add" data-act="tab-new" title="New tab in ${esc(spaceOf(S.space)?.name || "")}">+</button><span class="fill"></span>${tools()}`;
    return;
  }

  $("#tabbar").innerHTML = `${html}<span class="fill"></span>${tools()}`;
}

function tools() {
  const att = liveTasks().filter(needsYou).length;
  return `<div class="tools">
      <button class="tb" data-act="files">Files</button>
      <button class="tb" data-act="changes">Changes</button>
      <div style="width:1px;height:14px;background:var(--rule);margin:0 3px"></div>
      <button class="tb" data-act="panel" title="Relay column">
        <svg width="13" height="13" viewBox="0 0 18 18"><circle cx="5" cy="5" r="2" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="13" cy="13" r="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7 6l4 5.5" stroke="currentColor" stroke-width="1.4"/></svg>
        Relay ${att ? `<span class="need">${att}</span>` : ""}
      </button>
    </div>`;
}

/* =========================================================================
   Ribbon — the selected task's baton trace through its holders today.
   One step-chart lane per actor involved; the live segment marches.
   ========================================================================= */
function fmtAge(m) {
  if (m == null) return "";
  if (m < 1) return "now";
  return m < 60 ? `${Math.round(m)}m` : `${Math.round(m / 6) / 10}h`;
}
const lastMove = (t) => (t.moves && t.moves.length ? Math.max(...t.moves.map((m) => m.m)) : null);
const ageOf = (t) => { const m = lastMove(t); return m == null ? null : NOW - m; };

function fmtDur(m) {
  if (m < 60) return `${Math.round(m)}m`;
  return `${Math.floor(m / 60)}h${m % 60 ? ` ${Math.round(m % 60)}m` : ""}`;
}

/* custody: consecutive stretches held by the same actor collapse into one bar */
function segsOf(t) {
  const st = [...(t.moves || [])].sort((a, b) => a.m - b.m);
  if (!st.length) return [];
  const raw = st.map((mv, i) => ({
    from: mv.m,
    to: i + 1 < st.length ? st[i + 1].m : NOW,
    lane: i + 1 < st.length ? mv.a : (t.holder || mv.a),
  }));
  return raw.reduce((out, sg) => {
    const prev = out[out.length - 1];
    if (prev && prev.lane === sg.lane) prev.to = sg.to;
    else out.push({ ...sg });
    return out;
  }, []);
}

function renderRibbon(retry) {
  const measured = document.querySelector(".rb-plot")?.clientWidth || 0;
  const W = Math.max(420, measured || 900), H = 64;
  const x0 = 62, x1 = W - 18;
  const sel = S.sel ? taskOf(S.sel) : null;
  const hov = S.hover ? taskOf(S.hover) : null;
  const focus = hov || sel;
  const ghosted = Boolean(focus && sel && focus.n !== sel.n);

  if (!focus || !(focus.moves || []).length) {
    $("#ribbon").innerHTML = `
      <div class="rb-label"><b>${focus ? `T${focus.n}` : "relay"}</b><span>no handoffs</span></div>
      <div class="rb-plot"><div style="padding:2px 14px;font-size:11px;color:var(--dim)">
        ${focus ? "Nobody has touched it yet — it is still in the inbox." : "Select a task to see who held it, and for how long."}</div></div>
      <div class="rb-now"><span>now</span><b class="mono">${hhmm(NOW)}</b></div>`;
    return;
  }

  const st = [...focus.moves].sort((a, b) => a.m - b.m);
  const ids = [...new Set(st.map((m) => m.a).concat(focus.holder ? [focus.holder] : []))];
  const n = ids.length;
  const gap = n <= 1 ? H : (H - 34) / (n - 1);
  const barH = n <= 1 ? 13 : Math.min(11, Math.max(7, gap - 7));
  const top = (id) => (n <= 1 ? 12 : 10 + Math.max(0, ids.indexOf(id)) * gap);

  /* axis: start just before the first move, but never show less than 45 minutes of context
     and never more than 8 hours of it — a task started 5 minutes ago should not be a full-width bar */
  const firstM = Math.min(...st.map((m) => m.m));
  const DAY0 = Math.min(Math.max(firstM - 10, NOW - 480), NOW - 45);
  const span = Math.max(60, NOW - DAY0);
  const t2x = (m) => x0 + ((m - DAY0) / span) * (x1 - x0);
  const hours = [];
  for (let h = Math.ceil(DAY0 / 60); h * 60 < NOW - 10; h += span > 420 ? 2 : 1) hours.push(h % 24);

  const ink = (id) => (id && actorOf(id) ? actorInk(actorOf(id)) : "var(--muted)");
  const hatch = (id) => `hatch-${(id || "none").replace(/[^a-z0-9]/gi, "")}`;
  const defs = ids.filter((id) => actorOf(id)?.kind === "human").map((id) => `
    <pattern id="${hatch(id)}" width="5" height="5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="1.5" height="5" fill="${ink(id)}" opacity=".55"/>
    </pattern>`).join("");
  const body = `<g ${ghosted ? 'opacity=".5"' : ""}>`;

  /* one bar per stretch of custody: width = how long that actor held the baton */
  const segs = segsOf(focus);

  const bars = segs.map((sg, i) => {
    const xa = t2x(sg.from), xb = Math.max(xa + 2.5, t2x(sg.to));
    const y = top(sg.lane), h = barH, w = xb - xa;
    const last = i === segs.length - 1;
    const human = actorOf(sg.lane)?.kind === "human";
    const dtxt = fmtDur(sg.to - sg.from);
    /* a hollow bar is hatched, so the duration needs a plate under it to stay legible */
    const dur = w > 74 ? (human
      ? `<rect x="${xb - dtxt.length * 4.4 - 7}" y="${y + 1.5}" width="${dtxt.length * 4.4 + 5}" height="${h - 3}" fill="var(--panel)" opacity=".88" rx="1"/>
         <text class="dur on-hollow" x="${xb - 5}" y="${y + h / 2 + 3}" text-anchor="end">${dtxt}</text>`
      : `<text class="dur" x="${xb - 5}" y="${y + h / 2 + 3}" text-anchor="end">${dtxt}</text>`) : "";
    const paint = human
      ? `fill="url(#${hatch(sg.lane)})" stroke="${ink(sg.lane)}" stroke-opacity="${last ? ".55" : ".38"}" stroke-width="1"`
      : `fill="${ink(sg.lane)}" opacity="${last ? ".5" : ".72"}"`;
    return `<rect x="${xa}" y="${y}" width="${w}" height="${h}" rx="1.5" ${paint}>
      ${last ? `<animate attributeName="${human ? "stroke-opacity" : "opacity"}" values="${human ? ".45;.2;.45" : ".5;.32;.5"}" dur="3.4s" repeatCount="indefinite"/>` : ""}</rect>
      ${dur}
      <title>${esc(actorOf(sg.lane)?.name || sg.lane || "nobody")} · ${hhmm(sg.from)}–${hhmm(sg.to)} · ${fmtDur(sg.to - sg.from)}</title>`;
  }).join("");

  /* handoff connectors + event captions */
  let lastRight = -999;
  const marks = st.map((mv, i) => {
    const x = t2x(mv.m);
    const y2 = top(mv.a) + barH / 2;
    const yPrev = i === 0 ? y2 : top(st[i - 1].a) + barH / 2;
    const label = `${hhmm(mv.m)} ${mv.w}`;
    const w = label.length * 4.4;
    const show = x + w < x1 && x > lastRight + 10;
    if (show) lastRight = x + w;
    return `<g data-act="bead" data-n="${focus.n}" style="cursor:pointer">
      <line x1="${x}" x2="${x}" y1="${Math.min(yPrev, y2)}" y2="${Math.max(yPrev, y2)}" stroke="${ink(mv.a)}" opacity=".55"/>
      <circle cx="${x}" cy="${y2}" r="4" fill="var(--panel)"/>
      <circle cx="${x}" cy="${y2}" r="2.4" fill="${ink(mv.a)}"/>
      ${show ? `<text class="ev-text" x="${x + 5}" y="${H - 4}">${esc(label)}</text>` : ""}
      <title>${esc(actorOf(mv.a)?.name || mv.a)} · ${esc(mv.w)}</title></g>`;
  }).join("");

  const lanes = ids.map((id) => {
    const a = actorOf(id) || { name:id };
    return `<text class="lane-name" x="7" y="${top(id) + barH / 2 + 3}" fill="${actorInk(a)}">${glyph(a)} ${esc(a.name || id)}</text>`;
  }).join("");

  const ticks = hours.map((h) => {
    const x = t2x(h * 60);
    return `<line class="tick-line" x1="${x}" x2="${x}" y1="0" y2="${H - 14}"/>`;
  }).join("");

  $("#ribbon").innerHTML = `
    <div class="rb-label">
      <b>T${focus.n}</b>
      <span>${st.length} move${st.length === 1 ? "" : "s"}</span>
    </div>
    <div class="rb-plot"><svg class="trace" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" preserveAspectRatio="none" aria-label="who held T${focus.n}, and for how long">
      <defs>${defs}</defs>${ticks}${body}${bars}${lanes}${marks}</g>
      <line x1="${x1}" x2="${x1}" y1="0" y2="${H - 12}" stroke="${ink(focus.holder)}" opacity=".45"/>
      <circle cx="${x1}" cy="${top(focus.holder || st[st.length - 1].a) + barH / 2}" r="3.2" fill="${ink(focus.holder)}">
        <animate attributeName="opacity" values="1;.25;1" dur="3s" repeatCount="indefinite"/></circle>
    </svg></div>
    <div class="rb-now">
      <span>${focus.holder ? "holds" : "nobody"}</span>
      <b style="color:${ink(focus.holder)}">${esc(actorOf(focus.holder)?.name || "—")}</b>
      ${ageOf(focus) != null ? `<span class="mono" style="color:var(--dim)">${fmtAge(ageOf(focus))}</span>` : ""}
    </div>`;

  const real = $(".rb-plot")?.clientWidth || 0;
  if (!retry && real && Math.abs(real - W) > 2) renderRibbon(true);
}

function hhmm(m) {
  const h = Math.floor(m / 60), mm = Math.round(m % 60);
  return `${String(h).padStart(2,"0")}:${String(mm).padStart(2,"0")}`;
}

/* =========================================================================
   Filter + grouped list
   ========================================================================= */
function match(t) {
  if (t.status === "done") return false;
  if (S.filter === "you" && !needsYou(t)) return false;
  if (S.filter === "moving" && t.status !== "started") return false;
  if (S.actor && t.holder !== S.actor) return false;
  if (S.q) {
    const hay = `${t.n} ${t.title} ${t.thread || ""} ${spaceOf(t.space)?.name || ""}`.toLowerCase();
    if (!hay.includes(S.q.toLowerCase())) return false;
  }
  return true;
}

function groupKey(t) {
  if (S.group === "space") return t.space;
  if (S.group === "stage") return t.status;
  return t.holder || "nobody";
}

function renderFilters() {
  const all = liveTasks().length, you = liveTasks().filter(needsYou).length,
        moving = liveTasks().filter((t) => t.status === "started").length;
  $("#filters").innerHTML = `
    <button class="seg ${S.filter === "all" ? "on" : ""}" data-act="filter" data-id="all">All <b>${all}</b></button>
    <button class="seg ${S.filter === "you" ? "on" : ""}" data-act="filter" data-id="you" style="${you ? "color:var(--review)" : ""}">Wait on you <b>${you}</b></button>
    <button class="seg ${S.filter === "moving" ? "on" : ""}" data-act="filter" data-id="moving">Moving <b>${moving}</b></button>
    <span class="fill"></span>
    <button class="gbtn on" data-act="group-cycle" title="group by · click to cycle">${S.group === "relay" ? "relay map" : "by " + S.group}</button>`;
}

function railFor(t) {
  const cur = t.progress != null ? t.progress : STAGE[t.status];
  return `<span class="rail" title="stage ${cur + 1}/5">${[0,1,2,3,4].map((i) =>
    `<i class="${i < cur ? "f" : ""} ${i === cur ? "cur" : ""}" style="${i === cur ? `background:${statusInk(t.status)}` : ""}"></i>`).join("")}</span>`;
}

function taskRow(t) {
  const sel = S.sel === t.n, a = actorOf(t.holder), tab = tabOf(t);
  const chip = tab ? `<span class="tabchip" title="lives in ${esc(tab.name)}">${esc(tab.name)}</span>` : "";
  const body = `
    <button class="task ${sel ? "on" : ""} ${t.status === "done" ? "done" : ""}" data-act="sel" data-n="${t.n}">
      ${railFor(t)}
      <span class="num">T${t.n}</span>
      <span class="ti">${esc(t.title)}</span>
      ${a && a.kind === "agent" && t.live ? `<span class="live-dot working" title="agent working"></span>` : ""}
      ${chip}
      <span class="who" style="color:${actorInk(a)}" title="${esc(a?.name || "unassigned")}">${glyph(a)}</span>
    </button>`;
  return body + (sel ? detail(t, tab) : "");
}

function detail(t, tab) {
  const a = actorOf(t.holder), sp = spaceOf(t.space);
  const chain = `
    <div class="chain">
      <button class="chip" data-act="actor" data-id="${t.holder || ""}"><span style="color:${actorInk(a)}">${glyph(a)}</span><b>${esc(a?.name || "nobody")}</b></button>
      <span class="wire"></span>
      <span class="chip" style="color:${statusInk(t.status)}">${esc(t.status)}</span>
      <span class="wire"></span>
      <button class="chip" data-act="space" data-id="${t.space}"><b>${esc(sp?.name || "")}</b></button>
      <span class="wire"></span>
      ${tab ? `<button class="chip" data-act="open-tab" data-id="${tab.id}"><b>${esc(tab.name)}</b></button>`
            : `<span class="chip gone">no tab yet</span>`}
    </div>`;

  let mid = "";
  if (t.status === "blocked" && t.block) {
    mid = `<div class="why">
        <p>${esc(t.block.why)}</p>
        <div class="needs">${esc(t.block.needs)}</div>
      </div>
      <div class="opts">${t.block.options.map((o, i) =>
        `<button class="opt" data-act="answer" data-n="${t.n}" data-i="${i}"><span class="k">${i + 1}</span>${esc(o)}</button>`).join("")}</div>`;
  } else if (t.status === "review" && t.checks) {
    const ok = t.checks.filter((c) => c[1]).length;
    mid = `<div class="sect">verify · ${ok}/${t.checks.length}</div>
      ${t.checks.map((c, i) => `<button class="check ${c[1] ? "on" : ""}" data-act="check" data-n="${t.n}" data-i="${i}">
        <span class="box">${tick()}</span><span>${esc(c[0])}</span></button>`).join("")}`;
  }
  if (t.steps) {
    const ok = t.steps.filter((s) => s[1]).length;
    mid += `<div class="sect">plan · ${ok}/${t.steps.length}</div>
      ${t.steps.map((s, i) => `<button class="step ${s[1] ? "on" : ""}" data-act="step" data-n="${t.n}" data-i="${i}">
        <span class="box">${tick()}</span><span>${esc(s[0])}</span></button>`).join("")}`;
  }
  if (t.after && t.after.length) {
    mid += `<div class="sect">waits on</div>${t.after.map((n) => {
      const p = taskOf(n);
      return `<button class="check" data-act="sel" data-n="${n}"><span class="box" style="border-color:${p?.status === "done" ? "var(--ready)" : "var(--review)"}"></span><span>T${n} ${esc(p?.title || "")}${p?.status === "done" ? " · done" : ""}</span></button>`;
    }).join("")}`;
  }

  const acts = actRow(t, tab);
  const ask = S.ask === t.n ? `<div class="ask"><span>T${t.n} is done — close “${esc(tab?.name || "")}” with it?</span>
      <button class="btn" data-act="ask-close" data-n="${t.n}">Done + close</button>
      <button class="btn quiet" data-act="ask-keep" data-n="${t.n}">Keep tab</button></div>` : "";
  const log = t.activity && t.activity.length ? `<div class="log">${t.activity.slice(0, 3).map(([at, who, what]) =>
    `<p><b>${esc(at)}</b><span>${esc(who)} ${esc(what)}</span></p>`).join("")}</div>` : "";

  return `<div class="det">${chain}${mid}${acts}${ask}${log}</div>`;
}
const tick = () => `<svg width="7" height="7" viewBox="0 0 8 8"><path d="M1.2 4.2l1.8 1.9 3.8-4.2" fill="none" stroke="var(--panel)" stroke-width="1.4"/></svg>`;

function actRow(t, tab) {
  if (t.status === "review") {
    const ok = !t.checks || t.checks.every((c) => c[1]);
    return `<div class="acts">
      <button class="btn pri ${ok ? "" : "off"}" data-act="approve" data-n="${t.n}" ${ok ? "" : "title='tick every check first'"}>${ok ? "Approve · done" : "Approve · " + (t.checks ? t.checks.length - t.checks.filter(c=>c[1]).length : 0) + " left"}</button>
      <button class="btn" data-act="sendback" data-n="${t.n}">Send back</button>
      <span class="sp"></span>
      <button class="btn quiet" data-act="archive" data-n="${t.n}">Archive</button>
    </div>`;
  }
  if (t.status === "blocked") {
    return `<div class="acts"><button class="btn" data-act="sel" data-n="${t.n}">Reply in the agent's tab</button><span class="sp"></span>
      <button class="btn quiet" data-act="archive" data-n="${t.n}">Archive</button></div>`;
  }
  const start = t.status === "started" ? "" :
    `<button class="btn ${t.holder ? "" : "pri"}" data-act="start" data-n="${t.n}">${t.live ? "Restart" : "Start"}</button>`;
  return `<div class="acts">
    ${start}
    ${tab ? `<button class="btn" data-act="open-tab" data-id="${tab.id}">Open tab</button>` : ""}
    <span class="sp"></span>
    ${t.status === "started" ? `<button class="btn" data-act="done" data-n="${t.n}">Done</button>` : ""}
    <button class="btn quiet" data-act="archive" data-n="${t.n}">Archive</button>
  </div>`;
}

/* one glance over the whole board: every task is a bar, colour = who held it, hatch = a person.
   Same grammar as the ribbon, different zoom. */
function renderMap() {
  const rows = tasks.filter(match)
    .slice()
    .sort((a, b) => (ageOf(b) || 0) - (ageOf(a) || 0));
  const all = rows.flatMap((t) => (t.moves || []).map((m) => m.m));
  const firstM = all.length ? Math.min(...all) : NOW - 60;
  const T0 = Math.min(Math.max(firstM - 5, NOW - 480), NOW - 45);
  const span = NOW - T0;
  const p = (m) => ((m - T0) / span) * 100;

  const hours = [];
  for (let h = Math.ceil(T0 / 60); h * 60 < NOW - 4; h += 1) hours.push(h);
  const grid = hours.map((h) => `<span class="map-g" style="left:${p(h * 60)}%"></span>`).join("")
    + `<span class="map-g now" style="left:100%"></span>`;

  const head = `<div class="map-h"><span></span>
      <span style="position:relative;height:16px">${hours.map((h) =>
        `<span style="position:absolute;left:${p(h * 60)}%;transform:translateX(-50%)">${String(h % 24).padStart(2, "0")}</span>`).join("")}</span>
      <span style="text-align:right">age</span></div>`;

  const body = rows.map((t) => {
    const sg = segsOf(t);
    const bars = sg.map((x, i) => {
      const a = actorOf(x.lane);
      const human = a?.kind === "human";
      const last = i === sg.length - 1;
      const w = Math.max(0.6, p(x.to) - p(x.from));
      const cls = `map-b${human ? " human" : ""}${last && t.holder ? " live" : ""}${!x.lane ? " none" : ""}`;
      const st = x.lane ? `background:${human ? "" : actorInk(a)};opacity:${last && t.holder ? "" : ".72"}` : "";
      return `<span class="${cls}" style="left:${p(x.from)}%;width:${w}%;${st}" title="${esc(a?.name || "nobody")} · ${hhmm(x.from)}–${x.to >= NOW ? "now" : hhmm(x.to)}"></span>`;
    }).join("");
    const age = ageOf(t);
    const none = sg.length ? "" : `<span class="map-b none" style="left:0;width:6%"></span>`;
    return `<div class="map-r ${S.sel === t.n ? "on" : ""}" data-act="sel" data-n="${t.n}">
      <span class="no">T${t.n}</span>
      <span class="map-p">${grid}${none}${bars}</span>
      <span class="age">${age == null ? "" : fmtAge(age)}</span></div>`;
  }).join("");

  $("#list").innerHTML = `<div class="map">${head}
    ${body}
    <div class="map-foot"><span><i style="background:var(--agent)"></i>agent</span>
      <span><i class="hatch" style="background:repeating-linear-gradient(45deg,var(--ink) 0 1px,transparent 1px 4px);border:1px solid color-mix(in oklab,var(--ink) 45%,transparent)"></i>person</span>
      <span style="margin-left:auto">${rows.length} live · click to open</span></div>
    ${loadBlock(rows)}
  </div>`;
}

/* how much sits in each actor's court right now — the answer to "who is loaded" */
function loadBlock(rows) {
  const held = actors.map((a) => ({ a, n: rows.filter((t) => t.holder === a.id).length }));
  const nobody = rows.filter((t) => !t.holder).length;
  const max = Math.max(1, ...held.map((h) => h.n));
  const line = (a, n, ink) => `
    <div class="load-r ${n ? "" : "zero"}" ${a ? `data-act="actor" data-id="${a.id}"` : ""}>
      <span style="color:${ink};font-size:9px">${a ? glyph(a) : "○"}</span>
      <span class="nm">${esc(a ? a.name : "nobody")}</span>
      <span class="tr"><i style="width:${n ? Math.max(6, (n / max) * 100) : 0}%;background:${ink}"></i></span>
      <span class="ct">${n}</span>
    </div>`;
  return `<div class="load-blk"><div class="load-h">in court now</div>
    ${held.map(({ a, n }) => line(a, n, actorInk(a))).join("")}
    ${nobody ? line(null, nobody, "var(--dim)") : ""}</div>`;
}

function renderList() {
  if (S.group === "relay") { renderMap(); return; }
  const rows = tasks.filter(match);
  if (!rows.length) {
    $("#list").innerHTML = `<div style="padding:16px 14px;color:var(--dim);font-size:11.5px;line-height:1.5">
      Nothing here. ${S.q ? "Clear the filter." : "Add one below — it lands in this space's project."}</div>`;
    return;
  }
  const order = S.group === "stage"
    ? ["review","blocked","started","ready","open"]
    : S.group === "space" ? spaces.map((s) => s.id) : null;
  const groups = {};
  for (const t of rows) (groups[groupKey(t)] ||= []).push(t);

  let keys = Object.keys(groups);
  if (order) keys.sort((a, b) => {
    const ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
  if (S.group === "holder") keys.sort((x, y) => (x === "nobody" ? 1 : y === "nobody" ? -1 : 0));

  $("#list").innerHTML = keys.map((k) => {
    const list = groups[k];
    let label, sub = "";
    const ages = list.map(ageOf).filter((x) => x != null);
    const oldest = ages.length ? Math.max(...ages) : null;
    if (S.group === "holder") {
      const a = actorOf(k);
      label = `<span style="color:${actorInk(a)};font-size:9px">${glyph(a)}</span> ${esc(a?.name || "Nobody")}`;
      sub = `<span class="load" title="work in hand">${[0,1,2,3].map((i) => `<i class="${i < list.length ? "f" : ""}"></i>`).join("")}</span>`;
    } else if (S.group === "space") {
      label = `<span style="color:var(--dim);font-size:9px">▤</span> ${esc(spaceOf(k)?.name || k)}`;
    } else {
      label = `<span style="color:${statusInk(k)};font-size:9px">●</span> ${esc(k)}`;
    }
    return `<div class="grp">${label}<span class="cnt">${list.length}</span>${sub}
        ${oldest != null && oldest > 20 ? `<span class="att" style="${k === "you" && oldest > 60 ? "color:var(--review)" : ""}">oldest ${fmtAge(oldest)}</span>` : ""}</div>
      ${list.map(taskRow).join("")}`;
  }).join("");
}

/* =========================================================================
   Terminal pane — it names the task it serves, and the tab that owns it
   ========================================================================= */
function renderTerm() {
  const t = S.sel ? taskOf(S.sel) : null;
  const tab = t ? tabOf(t) : null;
  const name = tab ? tab.name : "shell";
  const folder = t ? `~/working/${spaceOf(t.space)?.name}/` : `~/working/${spaceOf(S.space)?.name}/`;
  const tag = t ? `<button class="tag" data-act="sel" data-n="${t.n}">T${t.n} · ${esc(t.status)}</button>` : "";
  $("#pane-head").innerHTML = `
    <span class="dot" style="background:${t?.live ? "var(--agent)" : "var(--dim)"}"></span>
    <span>${esc(tab?.agent ? actorOf(tab.agent)?.name : "shell")}</span>
    <span class="path">${esc(folder)}</span>
    <span class="grow"></span>
    ${tag}
    <span class="path" style="color:var(--dim)">${esc(name)}</span>`;

  $("#term-body").innerHTML = t ? t.live ? workingTerm(t) : reviewTerm(t) : idleTerm();
}

<div class="diff"><pre>@@ -41,14 +41,9 @@ def post(request):

/* =========================================================================
   Footer capture
   ========================================================================= */
function renderFoot() {
  const sp = spaceOf(S.space);
  $("#foot").innerHTML = `
    <div class="tgt"><svg width="11" height="11" viewBox="0 0 16 16"><path d="M1.5 5V2.5H14.5V5M8 2.5v11M5.5 13.5h5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      new task → ${esc(sp?.name || "the desk")}</div>
    <div class="capture">
      <svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1.5v9M1.5 6h9" stroke="currentColor" stroke-width="1.3"/></svg>
      <input id="capture" placeholder="New task — Enter adds it" autocomplete="off" spellcheck="false">
    </div>`;
  const input = $("#capture");
  input.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    const title = input.value.trim();
    if (!title) return;
    const n = Math.max(...tasks.map((t) => t.n)) + 1;
    tasks.unshift({ n, title, space:S.space, holder:null, status:"open", thread:null, tab:null, moves:[], activity:[] });
    input.value = "";
    S.sel = n; S.filter = "all"; S.actor = null;
    toast(`Added T${n} to ${spaceOf(S.space)?.name}`, "tsk add");
    renderAll();
  });
}

/* =========================================================================
   Actions
   ========================================================================= */
function setSpace(id) {
  S.space = id; S.actor = null;
  const first = tasks.filter((t) => match(t) && inSpace(t)).sort((a, b) => STAGE[b.status] - STAGE[a.status]);
  if (first.length) S.sel = first[0].n;
  renderAll();
}

function select(n) {
  const t = taskOf(n);
  if (!t) return;
  S.sel = n;
  if (t.space !== S.space) S.space = t.space;
  S.open[n] = true;
  renderAll();
}

function start(n) {
  const t = taskOf(n);
  if (!t) return;
  if (t.status === "started" && t.live) { toast(`T${n} is already running`, "Relay"); return; }
  const agent = t.holder && actorOf(t.holder)?.kind === "agent" ? t.holder : "pi";
  t.holder = agent; t.status = "started"; t.live = true; t.progress = 2;
  t.needs = null;
  const a = actorOf(agent);
  if (a) a.state = "working";
  const list = tabs[t.space] || (tabs[t.space] = []);
  if (!t.tab) {
    const id = `t${Math.max(0, ...list.map((x) => Number(String(x.id).slice(1)) || 0)) + 1}`;
    list.push({ id, name:`T${t.n}`, agent, task:t.n, live:true, settled:false });
    t.tab = id;
  } else {
    const tab = list.find((x) => x.id === t.tab);
    if (tab) { tab.live = true; tab.agent = agent; }
  }
  t.moves = [...(t.moves || []), { m:NOW - 1, a:agent, w:"started" }];
  t.activity = [[hhmm(NOW - 1), "you", `started it · ${actorOf(agent)?.name} is on it`], ...(t.activity || [])].slice(0, 3);
  toast(`T${n} started · ${actorOf(agent)?.name || agent} is on it`, "hc run");
  renderAll();
}

function done(n, mode) {
  const t = taskOf(n);
  if (!t) return;
  const tab = tabOf(t);
  if (tab && !mode) {
    S.ask = n; S.open[n] = true; S.sel = n;
    renderAll();
    return;
  }
  S.ask = null;
  t.status = "done"; t.live = false; t.needs = null;
  if (tab && mode === "close") {
    tabs[t.space] = (tabs[t.space] || []).filter((x) => x.id !== tab.id);
    toast(`T${n} done · closed ${tab.name}`, "tsk status");
  } else {
    toast(`T${n} done`, "tsk status");
  }
  if (t.holder && actorOf(t.holder)?.kind === "agent") actorOf(t.holder).state = "idle";
  renderAll();
}

function approve(n) {
  const t = taskOf(n);
  if (!t) return;
  const ok = !t.checks || t.checks.every((c) => c[1]);
  if (!ok) { toast("Tick every check before approving", "review"); return; }
  done(n, "close");
}

function sendBack(n) {
  const t = taskOf(n);
  if (!t) return;
  t.status = "started"; t.live = true; t.needs = null; t.progress = 2;
  t.holder = t.holder || "pi";
  if (actorOf(t.holder)?.kind === "agent") actorOf(t.holder).state = "working";
  t.moves = [...(t.moves || []), { m:NOW - 1, a:t.holder, w:"sent back" }];
  t.activity = [[hhmm(NOW - 1), "you", "sent it back with feedback"], ...(t.activity || [])].slice(0, 3);
  const tab = tabOf(t); if (tab) tab.live = true;
  toast(`T${n} sent back · ${actorOf(t.holder)?.name || "agent"} has it`, "tsk reply");
  renderAll();
}

function answer(n, i) {
  const t = taskOf(n);
  if (!t || !t.block) return;
  const choice = t.block.options[i];
  t.status = "started"; t.progress = 2; t.holder = t.holder || "you"; t.needs = null;
  t.block = null;
  t.activity = [[hhmm(NOW - 1), "you", `answered: “${choice}”`], ...(t.activity || [])].slice(0, 3);
  toast(`T${n} unblocked · “${choice}”`, "tsk reply");
  renderAll();
}

function flashTab(id) {
  S.tabFlash = id;
  const t = tasks.find((x) => x.tab === id);
  if (t) S.sel = t.n;
  renderAll();
  setTimeout(() => { S.tabFlash = null; renderTabs(); }, 900);
}

/* =========================================================================
   Wiring
   ========================================================================= */
function renderAll() {
  renderSide(); renderTabs(); renderRibbon(); renderFilters(); renderList(); renderTerm(); renderFoot();
  $("#rp-sub").textContent = (() => {
    const rows = liveTasks().filter(inSpace);
    const you = rows.filter(needsYou).length, mv = rows.filter((t) => t.status === "started").length;
    return `${spaces.length} spaces · ${rows.length} live · ${you} on you · ${mv} moving`;
  })();
  document.documentElement.dataset.theme = S.theme;
  $("#theme-name").textContent = S.theme === "dark" ? "Night" : "Day";
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const { act, id, n, i } = el.dataset;
  if (act === "space") setSpace(id);
  else if (act === "actor") { if (!id) return; S.actor = S.actor === id ? null : id; renderAll(); }
  else if (act === "sel") select(Number(n));
  else if (act === "filter") { S.filter = id; renderAll(); }
  else if (act === "group") { S.group = id; renderAll(); }
  else if (act === "strip") {
    S.strip = S.strip === "relay" ? "herdr" : "relay";
    const el = $("#strip-name"); if (el) el.textContent = S.strip;
    renderTabs();
  }
  else if (act === "tab-new") {
    const list = tabs[S.space] ||= [];
    const id = `t${Math.max(0, ...list.map((x) => Number(String(x.id).slice(1)) || 0)) + 1}`;
    list.push({ id, name: "shell", agent: null, task: null });
    renderTabs(); flashTab(id);
  }
  else if (act === "group-cycle") {
    const order = ["holder", "space", "stage", "relay"];
    S.group = order[(order.indexOf(S.group) + 1) % order.length];
    renderAll();
  }
  else if (act === "tab") flashTab(id);
  else if (act === "open-tab") flashTab(id);
  else if (act === "check") {
    const t = taskOf(Number(n)); t.checks[Number(i)][1] = t.checks[Number(i)][1] ? 0 : 1; renderAll();
  } else if (act === "step") {
    const t = taskOf(Number(n)); t.steps[Number(i)][1] = t.steps[Number(i)][1] ? 0 : 1; renderAll();
  } else if (act === "start") start(Number(n));
  else if (act === "done") done(Number(n));
  else if (act === "ask-close") done(Number(n), "close");
  else if (act === "ask-keep") done(Number(n), "keep");
  else if (act === "approve") approve(Number(n));
  else if (act === "sendback") sendBack(Number(n));
  else if (act === "answer") answer(Number(n), Number(i));
  else if (act === "archive") {
    const t = taskOf(Number(n)); t.status = "done"; t.live = false;
    toast(`T${n} archived · tsk unarchive T${n} brings it back`, "tsk archive"); renderAll();
  }
  else if (act === "theme") { S.theme = S.theme === "dark" ? "light" : "dark"; renderAll(); }
  else if (act === "panel" || act === "close") toast("The Relay column is a layout node — hidden state survives space switches", "layout");
  else if (act === "refresh") toast("One exec: tsk list --all --json", "refetch");
  else if (act === "bead") select(Number(n));
  else if (act === "palette") toast("⌘K — jump to a task, space, agent or tab", "commands");
  else if (act === "space-new") toast("space.new — name, folder, first tab", "commands");
  else if (act === "agent-new") toast("knownAgents() — pick the agent to run", "agents");
});

document.addEventListener("keydown", (e) => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName || "");
  if (e.key === "/" && !typing) {
    e.preventDefault();
    const box = $("#rp-search-input");
    if (box) box.focus();
    return;
  }
  if (typing) { if (e.key === "Escape") document.activeElement.blur(); return; }
  const rows = tasks.filter(match);
  const idx = rows.findIndex((t) => t.n === S.sel);
  if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); const t = rows[Math.min(rows.length - 1, idx + 1)]; if (t) select(t.n); }
  else if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); const t = rows[Math.max(0, idx - 1)]; if (t) select(t.n); }
  else if (e.key === "Enter") { const t = taskOf(S.sel); if (t) { S.open[t.n] = !S.open[t.n]; renderAll(); } }
  else if (e.key === "s") start(S.sel);
  else if (e.key === "d") done(S.sel);
  else if (e.key === "o") { const t = taskOf(S.sel); if (t?.tab) flashTab(t.tab); }
  else if (e.key === "t") { S.theme = S.theme === "dark" ? "light" : "dark"; renderAll(); }
  else if (e.key === "Escape") { if (S.q) { S.q = ""; renderAll(); } else { S.open = {}; renderAll(); } }
});

/* search lives inside the list header so it survives re-renders */
function mountSearch() {
  const wrap = document.createElement("div");
  wrap.className = "rp-search";
  wrap.innerHTML = `<svg width="12" height="12" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.4" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10.4 10.4L14 14" stroke="currentColor" stroke-width="1.3"/></svg>
    <input id="rp-search-input" placeholder="Filter tasks" autocomplete="off" spellcheck="false">`;
  const list = $("#list");
  list.parentNode.insertBefore(wrap, list);
  const input = wrap.querySelector("input");
  input.value = S.q || "";
  input.addEventListener("input", () => { S.q = input.value; renderList(); });
}

/* hover a row → the ribbon previews that task's trace without committing to it */
document.addEventListener("mouseover", (e) => {
  const el = e.target.closest('[data-act="sel"]');
  const n = el ? Number(el.dataset.n) : null;
  if (n === S.hover) return;
  S.hover = n;
  renderRibbon();
});
document.addEventListener("mouseleave", (e) => {
  if (e.target.id === "list" && S.hover) { S.hover = null; renderRibbon(); }
}, true);
window.addEventListener("resize", () => renderRibbon());

document.documentElement.dataset.theme = S.theme;
/* ?theme=light&n=29&group=stage — makes the spec’s screenshots reproducible */
const qp = new URLSearchParams(location.search);
if (qp.get("theme")) S.theme = qp.get("theme");
if (qp.get("n")) S.sel = Number(qp.get("n"));
if (qp.get("group")) S.group = qp.get("group");
  if (qp.get("strip")) S.strip = qp.get("strip");
if (qp.get("q")) S.q = qp.get("q");
tasks.forEach((t) => { if (t.status !== "done") S.open[t.n] = t.n === S.sel; });
mountSearch();
renderAll();
</script>
</body>
